apiVersion: 1

datasources:
  - name: datasource
    uid: kinetica-grafana-datasource-test
    type: kinetica-grafana-datasource   # Must match the "id" in your plugin.json
    access: proxy
    orgId: 1
    # Values come from the .env file that docker-compose loads (env_file: - .env).
    url: $KINETICA_URL
    isDefault: true
    version: 1
    editable: true

    jsonData:
      path: /resources
      username: $KINETICA_USER
      tlsSkipVerify: true

    secureJsonData:
      password: $KINETICA_PASSWORD