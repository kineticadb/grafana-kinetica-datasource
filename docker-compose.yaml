services:
  grafana:
    container_name: kinetica-grafana-dev
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    ports:
      - "3000:3000"
      - "2345:2345"
    
    environment:
      - GF_LOG_LEVEL=error
      - GF_LOG_FILTERS=plugin.kinetica-grafana-datasource:debug
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=kinetica-grafana-datasource

    # 1. Load the .env file.
    # `required: false` so CI can still run `docker compose up`; locally the
    # file supplies the Kinetica credentials used by
    # provisioning/datasources/datasources.yml.
    env_file:
      - path: .env
        required: false

    # ----------------------------------------------------------------
    # NETWORK STRATEGY: Host Gateway
    # Since Kinetica is on the default 'bridge' network, we cannot use 
    # DNS resolution by container name. 
    # Instead, we map 'host.docker.internal' to your Host IP.
    # ----------------------------------------------------------------
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./:/var/lib/grafana/plugins/kinetica-grafana-datasource
      # This line maps your local 'provisioning' folder to the container's config location
      - ./provisioning:/etc/grafana/provisioning